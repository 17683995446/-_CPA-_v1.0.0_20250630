[project]
name = "cpa-learning-app"
version = "0.2.0"
description = "CPA 注册会计师智能学习平台 — 自适应学习、知识图谱、游戏化激励"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CPA Learning Team" }]
readme = "README.md"

dependencies = [
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.0",
    "email-validator>=2.2.0",
    "SQLAlchemy>=2.0.50",
    "bcrypt>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "unit: 单元测试 — 隔离的单个函数/类测试",
    "integration: 集成测试 — 跨模块协作测试",
    "system: 系统测试 — 端到端完整流程测试",
]

[tool.coverage.run]
source = ["backend/app"]
omit = [
    "backend/app/question_data/generators/*",
    "backend/app/past_exam_data*.py",
    "backend/app/static/*",
]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (formatter handles)
    "B008",  # function call in default argument (FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
