# CPA Learning App CI/CD 流水线
# 触发条件：push 到 main 分支或 Pull Request

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码检查（ruff）
        working-directory: backend
        run: |
          pip install ruff
          ruff check app/ tests/
        continue-on-error: true  # 警告不阻断流水线

      - name: 单元测试
        working-directory: backend
        run: python -m pytest tests/unit/ -v --tb=short -m unit

      - name: 集成测试
        working-directory: backend
        run: python -m pytest tests/integration/ -v --tb=short -m integration

      - name: 系统测试
        working-directory: backend
        run: python -m pytest tests/system/ -v --tb=short -m system

      - name: 测试覆盖率报告
        working-directory: backend
        run: |
          pip install pytest-cov
          python -m pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建 Docker 镜像
        run: docker build -t cpa-app:ci .
