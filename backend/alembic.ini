# Alembic 配置文件
# 数据库迁移管理工具

[alembic]
# 迁移脚本目录
script_location = alembic

# 数据库 URL（由 env.py 从 app.config 动态读取，此处仅占位）
sqlalchemy.url = sqlite:///data/cpa_learning.db

# 模板引擎
template = generic

# 时间戳格式
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# 时区
timezone = Asia/Shanghai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)-5.5s] %(name)s: %(message)s
datefmt = %Y-%m-%d %H:%M:%S
